name: End-to-end Tests (Cron)
on:
  schedule:
    - cron: '10 * * * *'

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome, firefox, edge]
        env: [
          https://aceretro.frontend.staging.mmli1.ncsa.illinois.edu,
          https://aceretro.platform.moleculemaker.org,
        ]

    name: E2E on ${{ matrix.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with private NPM packages
        run: |
          echo "//hub.chemaxon.com/artifactory/api/npm/npm/:_auth=${{ secrets.NPM_TOKEN }}" > $HOME/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> $HOME/.npmrc
          echo "npmrc_path=$HOME/.npmrc" >> "$GITHUB_ENV"

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
        env:
          BASE_URL: ${{ matrix.env }}
