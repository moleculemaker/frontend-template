name: Cron
# The schedule is off until the template itself is deployed to staging (#15): no
# host serves it yet, so a nightly run could only fail. Apps created from the
# template should restore it with their own staging and prod hosts.
on:
  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env:
          - test.frontend.staging.mmli2.ncsa.illinois.edu
    name: E2E on ${{ matrix.env }} (Cron)
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          npm ci

      - name: Run E2E Tests
        run: |
          export TESTING_URL=${{ matrix.env }}
          xvfb-run --auto-servernum npx nightwatch ./nightwatch --env chrome
