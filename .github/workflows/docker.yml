name: Docker

# Builds the frontend image and pushes it to GitHub Container Registry, as
# ghcr.io/<org>/<id>-frontend (derived from app.yaml):
#   pull requests  pr-<N> and staging (staging runs the most recently built PR)
#   main           main (prod runs it) and sha-<short>
# The repo must live in the org its family deploys from (moleculemaker for
# alphasynthesis, iBioFoundry for alphasynbio), because GITHUB_TOKEN can only push
# packages to its own org.
#
# The first push creates the package with the repo's visibility: public for a public
# repo (as new apps are, so the cluster needs no pull secret), private for an internal
# or private one. A private package needs an org admin to make it public in the
# package settings before the cluster can pull it (the chart has no imagePullSecrets).
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/moleculemaker/test-frontend # app:sync image
          flavor: latest=false
          tags: |
            type=ref,event=pr
            type=raw,value=staging,enable=${{ github.event_name == 'pull_request' }}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,enable={{is_default_branch}}

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
