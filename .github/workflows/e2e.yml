name: End-to-end Tests
on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published, edited, created]

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome, firefox, edge]

    name: E2E on ${{ matrix.browser }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with private NPM packages
        run: |
          echo "@chemaxon:registry=https://hub.chemaxon.com/artifactory/api/npm/npm/" > $HOME/.npmrc
          echo "//hub.chemaxon.com/artifactory/api/npm/npm/:_auth=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc
          echo "@moleculemaker:registry=https://npm.pkg.github.com" >> $HOME/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" >> $HOME/.npmrc
          echo "npmrc_path=$HOME/.npmrc" >> "$GITHUB_ENV"

      # --------------------------- For local environment -------------------------- #

      - name: Install xvfb
        run: |
          if ! command -v xvfb-run &> /dev/null; then
            sudo apt update
            sudo apt install -y xvfb
          fi

      - name: Setup WebDriver for Local Environment
        run: |
          case ${{ matrix.browser }} in
            "chrome")
              if [ -z "$CHROMEWEBDRIVER" ]; then
                LATEST_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE")
                wget "https://chromedriver.storage.googleapis.com/$LATEST_VERSION/chromedriver_linux64.zip"
                sudo unzip chromedriver_linux64.zip -d /usr/local/bin
                sudo chmod a+x /usr/local/bin/chromedriver
                sudo rm chromedriver_linux64.zip
                echo "CHROMEWEBDRIVER=/usr/local/bin/chromedriver" >> "$GITHUB_ENV"
              fi
              ;;
            "firefox")
              if [ -z "$GECKOWEBDRIVER" ]; then
                LATEST_VERSION=$(curl -s "https://api.github.com/repos/mozilla/geckodriver/releases/latest" | jq -r '.tag_name')
                wget "https://github.com/mozilla/geckodriver/releases/download/$LATEST_VERSION/geckodriver-$LATEST_VERSION-linux64.tar.gz"
                sudo tar -xzf geckodriver-$LATEST_VERSION-linux64.tar.gz -C /usr/local/bin
                sudo chmod a+x /usr/local/bin/geckodriver
                sudo rm geckodriver-$LATEST_VERSION-linux64.tar.gz
                echo "GECKOWEBDRIVER=/usr/local/bin/geckodriver" >> "$GITHUB_ENV"
              fi
              ;;
            "edge")
              if [ -z "$EDGEWEBDRIVER" ]; then
                LATEST_VERSION=$(curl -s "https://msedgedriver.azureedge.net/LATEST_STABLE")
                wget "https://msedgedriver.azureedge.net/$LATEST_VERSION/edgedriver_linux64.zip"
                sudo unzip edgedriver_linux64.zip -d /usr/local/bin
                sudo chmod a+x /usr/local/bin/msedgedriver
                sudo rm edgedriver_linux64.zip
                echo "EDGEWEBDRIVER=/usr/local/bin/msedgedriver" >> "$GITHUB_ENV"
              fi
              ;;
          esac

      # ------------------------------------ END ----------------------------------- #

      - name: Setup WebDriver
        run: |
          case ${{ matrix.browser }} in
            "chrome")
              echo "WEBDRIVER=$CHROMEWEBDRIVER" >> "$GITHUB_ENV"
              ;;
            "firefox")
              echo "WEBDRIVER=$GECKOWEBDRIVER" >> "$GITHUB_ENV"
              ;;
            "edge")
              echo "WEBDRIVER=$EDGEWEBDRIVER" >> "$GITHUB_ENV"
              ;;
          esac
      

      - name: Install dependencies
        run: |
          npm ci

      - name: Start application and run tests
        run: |
          # check if WEBDRIVER has right permission
          ls -l $WEBDRIVER
          sudo chmod a+x $WEBDRIVER
          
          npm run start & # Runs in background
          APP_PID=$!
          
          echo "Waiting for application to be ready on port 4200..."
          COUNTER=0
          until curl -s http://localhost:4200 > /dev/null || [ $COUNTER -eq 24 ]; do
            # Check if the process is still running
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "❌ Application failed to start"
              exit 1
            fi
            
            echo "⏳ Attempting to connect to http://localhost:4200 (Attempt $((COUNTER + 1)) of 24)"
            sleep 5
            COUNTER=$((COUNTER + 1))
          done
          
          if [ $COUNTER -eq 24 ]; then
            echo "❌ Timeout: Application failed to start within 120 seconds"
            exit 1
          fi
          
          echo "✅ Application is ready!"
          sudo xvfb-run --auto-servernum npx nightwatch ./nightwatch --env ${{ matrix.browser }}