name: End-to-end Tests
on:
  push:
    branches: [main, develop]
  pull_request:
  release:
    types: [published, edited, created]

jobs:
  e2e-tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        browser: [chrome]

    name: E2E on ${{ matrix.browser }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate with private NPM packages
        run: |
          echo "@chemaxon:registry=https://hub.chemaxon.com/artifactory/api/npm/npm/" > $HOME/.npmrc
          echo "//hub.chemaxon.com/artifactory/api/npm/npm/:_auth=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc
          echo "@moleculemaker:registry=https://npm.pkg.github.com" >> $HOME/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> $HOME/.npmrc
          echo "npmrc_path=$HOME/.npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install xvfb -y
          npm ci

      - name: Set ChromeDriver permissions
        run: sudo chmod +x /usr/local/share/chromedriver-linux64

      - name: Nightwatch run
        run: xvfb-run --auto-servernum npx nightwatch ./nightwatch --env ${{ matrix.browser }}
