# Defines the deployment of the app running in a pod on any worker node
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: {{ .Values.controller.image }}

          env:

          - name: JOB_MANAGER_API_HOSTNAME
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: hostname

          - name: JOB_MANAGER_API_BASEPATH
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: basePath

          - name: OAUTH_SIGNIN_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: signInUrl

          - name: OAUTH_SIGNOUT_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: signOutUrl

          - name: OAUTH_USERINFO_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: userInfoUrl

          - name: FRONTEND_ONLY
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: frontendOnly

          - name: ENVIRONMENT
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: environment
                # Optional: config without it means no banner, not a failed pod
                optional: true

          - name: PROD_URL
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: prodUrl
                # Optional: config without it means no banner, not a failed pod
                optional: true

          - name: MATOMO_MODE
            valueFrom:
              configMapKeyRef:
                name: {{ .Release.Name }}-config
                key: matomoMode
                # Optional: config without it means direct tracking, not a failed pod
                optional: true

          ports:
            - containerPort: 80
          imagePullPolicy: Always
