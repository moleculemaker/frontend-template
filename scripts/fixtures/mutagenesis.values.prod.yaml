ingress:
  hostname: mutagenesis.platform.ibiofoundry.illinois.edu
  extraHosts:
  - mutagenesis.frontend.mmli2.ncsa.illinois.edu
  tls: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: "ibiofoundry-mutagenesis-prod-domain-redirect@kubernetescrd"

controller:
  image: ghcr.io/ibiofoundry/mutagenesis-frontend:latest

imagePullSecrets:
  - name: ibiofoundry-regcred

imagePullSecret:
  name: ibiofoundry-regcred
  encryptedDockerConfigJson: ""

config:
  hostname: "https://mmli.fastapi.mmli2.ncsa.illinois.edu"
  basePath: ""
  signInUrl: "https://auth.platform.moleculemaker.org/oauth2/start?rd=https%3A%2F%2Fmutagenesis.platform.ibiofoundry.illinois.edu%2Fconfiguration"
  signOutUrl: "https://auth.platform.moleculemaker.org/oauth2/sign_out?rd=https%3A%2F%2Fmutagenesis.platform.ibiofoundry.illinois.edu%2Fconfiguration"
  userInfoUrl: "https://auth.platform.moleculemaker.org/oauth2/userinfo"
  frontendOnly: "false"

extraDeploy:
- apiVersion: traefik.io/v1alpha1
  kind: Middleware
  metadata:
    name: mutagenesis-prod-domain-redirect
    namespace: ibiofoundry
  spec:
    redirectRegex:
      regex: "^https://mutagenesis.frontend.mmli2.ncsa.illinois.edu/(.*)"
      replacement: "https://mutagenesis.platform.ibiofoundry.illinois.edu/${1}"
      permanent: true
